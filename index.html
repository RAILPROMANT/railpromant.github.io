<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ordenado</title>
<meta name="theme-color" content="#0F1115">
<meta name="description" content="Tickets para SiRADIG, agenda, vencimientos y fechas importantes.">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/icon-192.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen phone app — scrolling view above a fixed bottom nav; forms open as bottom sheets. Deliberately single dark theme. */
:root{
  --bg:#0F1115; --surface:#1A1D23; --surface2:#262A31; --line:#2E333B; --nav:#13161B;
  --fg:#F2F2EE; --muted:#9AA0A8; --ink:#14161A;
  --lime:#C6F36B; --blue:#8AB4FF; --violet:#C4A7FF; --violet-ink:#17112A;
  --orange:#FFB066; --red:#FF8A7A; --amber:#FFC857; --teal:#7FD9C0;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.view{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:800}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.card{background:var(--surface);border-radius:22px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg,.btn svg,.navb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:48px;border-radius:16px;border:0;padding:0 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ghost{background:var(--surface2);color:var(--fg)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn-danger{background:transparent;border:1px solid #5A2E29;color:var(--red)}
.btn-sm{min-height:40px;border-radius:12px;padding:0 12px;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:6px 0;font-weight:800;font-size:13px;color:var(--lime)}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--surface2);color:#D6DAE0;white-space:nowrap}
.empty{text-align:center;padding:22px 16px;color:var(--muted);background:var(--surface);border-radius:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datechip{width:50px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:14px}
.datechip b{font-size:18px;line-height:1.1}
.datechip span{font-size:11px;font-weight:700;text-transform:uppercase}

/* Home blocks */
.urgent{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:#2A1F17;border:1px solid #4A3322}
.hero{background:var(--violet);color:var(--violet-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .count{display:flex;flex-direction:column;align-items:center;justify-content:center;width:104px;height:104px;flex-shrink:0;border-radius:28px;background:var(--violet-ink);color:var(--violet)}
.hero .count b{font-size:50px;line-height:1;letter-spacing:-.03em}
.hero .mini{background:rgba(23,17,42,.1);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left;color:inherit}
.tile{border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:140px;border:0;text-align:left}
.tile .big{font-size:26px;font-weight:800;line-height:1}

/* Nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);border-top:1px solid #23272E;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.navb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;background:none;border:0;color:#8D939C;font-size:11px;font-weight:600}
.navb[aria-current="page"]{color:var(--lime);font-weight:800}
.navb svg{width:22px;height:22px}
.scanb{justify-self:center;width:60px;height:60px;margin-top:-30px;border-radius:20px;border:0;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(198,243,107,.25)}
.scanb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:20px;border:0;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

/* Segmented, filters */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:#C9CDD3;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal button{height:44px;border-radius:14px;border:0;background:transparent;color:var(--fg);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cal button i{width:5px;height:5px;border-radius:99px;background:transparent}
.cal button.dot i{background:var(--blue)}
.cal button.dotv i{background:var(--violet)}
.cal button.past{color:#6E747D}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cal button.sel{background:var(--blue);color:var(--bg)}
.cal button.sel i{background:var(--bg)}

/* Bars */
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:3px;background:var(--surface2)}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,6,8,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#C9CDD3}
.f input,.f select{min-height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 14px;font-size:16px;font-weight:600;color:var(--fg);width:100%}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.option{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:0;text-align:left;width:100%;cursor:pointer}
.option input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.copyrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.copyrow:last-child{border-bottom:0}
.copyrow .v{font-size:15px;font-weight:700;user-select:all;-webkit-user-select:all}
.copybtn{min-width:44px;height:44px;border-radius:14px;border:0;background:var(--surface2);color:#D6DAE0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:12px;font-weight:800}
.copybtn.ok{background:var(--lime);color:var(--ink)}
.copybtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.spin{width:36px;height:36px;border-radius:99px;border:4px solid var(--surface2);border-top-color:var(--lime);animation:sp 1s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
body{margin:0}
#main{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.scanner{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:3/4;max-width:100%}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scanner .frame{position:absolute;inset:18%;border:4px solid var(--lime);border-radius:26px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="app">
  <main id="main" aria-live="polite"></main>
  <nav class="bar" aria-label="Navegación principal">
    <button class="navb" data-go="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="navb" data-go="tickets"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Tickets</button>
    <button class="scanb" data-act="scan" aria-label="Agregar ticket"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></svg></button>
    <button class="navb" data-go="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="navb" data-go="avisos"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>Avisos</button>
  </nav>
  <div id="fab"></div>
  <div id="sheetHost"></div>
  <div id="toastHost"></div>
</div>

<script src="jsQR.js"></script>
<script>
(function(){
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const todayISO=()=>iso(new Date());
const daysUntil=s=>Math.round((parseISO(s)-today0())/86400000);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtDate=s=>{const d=parseISO(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const longDate=s=>{const d=parseISO(s);return cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()]};
const fmtCuit=c=>{c=String(c||'').replace(/\D/g,'');return c.length===11?c.slice(0,2)+'-'+c.slice(2,10)+'-'+c.slice(10):c};
const money=n=>{n=Number(n)||0;const dec=Math.round(n*100)%100!==0;return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:2})};
const parseMoney=s=>{s=String(s||'').trim();if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s.replace(/[^\d.]/g,''));return isNaN(n)?null:n};
const cuando=n=>n<0?('Venció hace '+(-n)+(n===-1?' día':' días')):n===0?'Hoy':n===1?'Mañana':'En '+n+' días';
const addMonths=(s,k)=>{const d=parseISO(s);const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)};
const uid=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem('ordenado-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ordenado-'+k,JSON.stringify(v))}catch(e){}}};

const ICON={
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg>',
 cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 img:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8.5"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
 receipt:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 gift:'<svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8z"/></svg>',
 warn:'<svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
 bell:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>'
};

const TIPOS={'1':'Factura A','2':'Nota de débito A','3':'Nota de crédito A','6':'Factura B','7':'Nota de débito B','8':'Nota de crédito B','11':'Factura C','12':'Nota de débito C','13':'Nota de crédito C','51':'Factura M','81':'Tique factura A','82':'Tique factura B','83':'Tique','111':'Tique factura C'};
const RUBROS=['Gastos médicos y paramédicos','Cuotas de medicina prepaga','Alquiler de vivienda','Gastos de educación','Indumentaria y equipamiento de trabajo','Servicio doméstico','Primas de seguro','Intereses de crédito hipotecario','Otro'];
const RCOL=['#8AB4FF','#C6F36B','#C4A7FF','#FFC857','#FFB066','#7FD9C0','#FF8A7A','#D6DAE0','#6E747D'];
const rcol=r=>RCOL[Math.max(0,RUBROS.indexOf(r))];

/* ---------- state + store ---------- */
const COLS={tickets:'tickets',eventos:'eventos',venc:'vencimientos',fechas:'fechas'};
const now=new Date();
const S={tickets:[],eventos:[],venc:[],fechas:[],ready:false,view:'inicio',
  calY:now.getFullYear(),calM:now.getMonth(),selDay:todayISO(),
  tkMonth:todayISO().slice(0,7),tkFilter:'todos'};
let db=null;

function saveLocal(k){ls.set('data-'+k,S[k])}
const store={
  async add(k,data){data.creado=Date.now();
    if(db){await db.collection(COLS[k]).add(data)}
    else{data.id=uid();S[k].push(data);saveLocal(k);render()}},
  async update(k,id,patch){
    if(db){await db.doc(COLS[k]+'/'+id).update(patch)}
    else{const it=S[k].find(x=>x.id===id);if(it)Object.assign(it,patch);saveLocal(k);render()}},
  async remove(k,id){
    if(db){await db.doc(COLS[k]+'/'+id).delete()}
    else{S[k]=S[k].filter(x=>x.id!==id);saveLocal(k);render()}}
};
async function safe(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio. Borrá registros viejos para seguir guardando.':'No se pudo guardar. Revisá la conexión y probá de nuevo.');return false}}

/* ---------- derived ---------- */
const pendVenc=()=>S.venc.filter(v=>!v.pagado).sort((a,b)=>a.fecha<b.fecha?-1:1);
function nextFecha(f){const t=today0();let d=new Date(t.getFullYear(),f.mes-1,f.dia);if(d<t)d=new Date(t.getFullYear()+1,f.mes-1,f.dia);return d}
const fechasOrd=()=>S.fechas.map(f=>{const d=nextFecha(f);return Object.assign({},f,{prox:iso(d),faltan:Math.round((d-today0())/86400000)})}).sort((a,b)=>a.faltan-b.faltan);
const REPITE=[['NO','No se repite'],['DAILY','Todos los días'],['WEEKLY','Todas las semanas'],['MONTHLY','Todos los meses'],['YEARLY','Todos los años']];
const repLabel=r=>(REPITE.find(x=>x[0]===r)||REPITE[0])[1];
function occursOn(e,s){
  if(!e.fecha||s<e.fecha)return false;const r=e.repite||'NO';if(r==='NO')return s===e.fecha;if(r==='DAILY')return true;
  const a=parseISO(e.fecha),b=parseISO(s);
  if(r==='WEEKLY')return a.getDay()===b.getDay();
  const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();const dd=Math.min(a.getDate(),last);
  if(r==='MONTHLY')return b.getDate()===dd;
  if(r==='YEARLY')return a.getMonth()===b.getMonth()&&b.getDate()===dd;return false}
const fechaOn=(f,s)=>{const b=parseISO(s);return b.getMonth()+1===Number(f.mes)&&b.getDate()===Number(f.dia)};
function eventosFuturos(){const t=todayISO();const hm=pad(new Date().getHours())+':'+pad(new Date().getMinutes());const out=[];
  S.eventos.forEach(e=>{let d=parseISO(e.fecha>t?e.fecha:t);
    for(let i=0;i<400;i++){const s=iso(d);if(occursOn(e,s)&&(s>t||!e.hora||e.hora>=hm)){out.push(Object.assign({},e,{fecha:s}));break}if((e.repite||'NO')==='NO'&&s>=e.fecha)break;d.setDate(d.getDate()+1)}});
  return out.sort((a,b)=>(a.fecha+(a.hora||'00:00'))<(b.fecha+(b.hora||'00:00'))?-1:1)}
const tkDelMes=m=>S.tickets.filter(t=>(t.fecha||'').slice(0,7)===m);

function gcal(o){
  let s,e;const c=o.fecha.replace(/-/g,'');
  if(o.hora){const d=parseISO(o.fecha);const [h,mi]=o.hora.split(':').map(Number);d.setHours(h,mi);const f=new Date(d.getTime()+3600000);
    const st=x=>iso(x).replace(/-/g,'')+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';s=st(d);e=st(f)}
  else{const n=parseISO(o.fecha);n.setDate(n.getDate()+1);s=c;e=iso(n).replace(/-/g,'')}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(o.titulo)+'&dates='+s+'/'+e+'&ctz=America/Argentina/Buenos_Aires'+(o.recur?'&recur='+encodeURIComponent('RRULE:FREQ='+o.recur):'')+(o.detalle?'&details='+encodeURIComponent(o.detalle):'');
}
const gcalBtn=o=>'<a class="btn btn-line" href="'+esc(gcal(o))+'" target="_blank" rel="noopener">'+ICON.bell+'Agregar alerta en Google Calendar</a>';

function vTickets(){
  const m=S.tkMonth;const [y,mm]=m.split('-').map(Number);
  let all=tkDelMes(m).sort((a,b)=>a.fecha<b.fecha?1:-1);
  const tot=all.reduce((a,t)=>a+(Number(t.monto)||0),0);const cargados=all.filter(t=>t.cargado).length;
  const por={};all.forEach(t=>{por[t.rubro]=(por[t.rubro]||0)+(Number(t.monto)||0)});
  const rub=Object.keys(por).sort((a,b)=>por[b]-por[a]);
  const list=all.filter(t=>S.tkFilter==='pend'?!t.cargado:S.tkFilter==='arca'?t.cargado:true);
  let out='<header class="between"><div class="col"><span class="muted" style="font-size:13px;font-weight:600">Deducciones SiRADIG</span><h1>Tickets</h1></div><button class="iconbtn" style="background:var(--lime);color:var(--ink)" data-act="scan" aria-label="Agregar ticket">'+ICON.plus+'</button></header>';
  out+='<div class="between card" style="padding:8px"><button class="iconbtn" style="background:var(--surface2)" data-act="tkmes" data-d="-1" aria-label="Mes anterior">'+ICON.back+'</button><span style="font-weight:800">'+cap(MESES[mm-1])+' '+y+'</span><button class="iconbtn" style="background:var(--surface2)" data-act="tkmes" data-d="1" aria-label="Mes siguiente">'+ICON.next+'</button></div>';
  out+='<section class="card" style="border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px"><div class="between" style="align-items:flex-end"><div class="col" style="gap:4px"><span class="muted" style="font-size:13px;font-weight:600">Total deducible del mes</span><span class="num" style="font-size:36px;font-weight:800;letter-spacing:-.03em">'+money(tot)+'</span></div><span style="font-size:13px;font-weight:700;color:var(--lime)">'+cargados+' de '+all.length+' cargados</span></div>';
  if(rub.length){out+='<div class="stack">'+rub.map(r=>'<div style="flex:'+por[r]+';background:'+rcol(r)+'"></div>').join('')+'</div><div class="list" style="gap:8px">'+rub.map(r=>'<div class="row" style="gap:10px;font-size:14px"><span class="sw" style="background:'+rcol(r)+'" aria-hidden="true"></span><span style="flex:1;min-width:0" class="ellip">'+esc(r)+'</span><span class="num" style="font-weight:700">'+money(por[r])+'</span></div>').join('')+'</div>'}
  out+='</section>';
  out+='<div class="seg" role="group" aria-label="Filtrar tickets">'+[['todos','Todos'],['pend','Pendientes'],['arca','Cargados']].map(f=>'<button data-act="tkfilter" data-f="'+f[0]+'" aria-pressed="'+(S.tkFilter===f[0])+'">'+f[1]+'</button>').join('')+'</div>';
  if(!S.ready)out+='<div class="spin" role="status" aria-label="Cargando"></div>';
  else if(!all.length)out+='<div class="empty"><span>No hay tickets en '+MESES[mm-1]+'.</span><button class="btn btn-lime" data-act="scan">'+ICON.cam+'Escanear un ticket</button></div>';
  else if(!list.length)out+='<div class="empty">No hay tickets en este filtro.</div>';
  else out+='<div class="list">'+list.map(t=>'<div class="item"><button class="item-main" data-act="ticket" data-id="'+t.id+'"><div class="ico" aria-hidden="true" style="background:var(--surface2);color:#D6DAE0">'+ICON.receipt+'</div><div class="col"><span style="font-weight:700" class="ellip">'+esc(t.razon||'CUIT '+fmtCuit(t.cuit))+'</span><span class="muted ellip" style="font-size:12px">'+fmtDate(t.fecha).slice(0,5)+' · '+esc(t.rubro)+'</span></div></button><div class="col" style="align-items:flex-end;gap:6px"><span class="num" style="font-weight:800">'+money(t.monto)+'</span><button data-act="tktoggle" data-id="'+t.id+'" style="min-height:30px;padding:0 10px;border-radius:99px;border:0;font-size:11px;font-weight:800;background:'+(t.cargado?'rgba(198,243,107,.14)':'#3A2C1E')+';color:'+(t.cargado?'var(--lime)':'#FFC48F')+'" aria-label="'+(t.cargado?'Marcar como pendiente':'Marcar como cargado en ARCA')+'">'+(t.cargado?'Cargado':'Pendiente')+'</button></div></div>').join('')+'</div>';
  if(all.some(t=>!t.cargado))out+='<p class="note" style="margin:0">Para cargarlos: abrí SiRADIG en la página de ARCA, tocá cada ticket pendiente acá y copiá los datos campo por campo. Después marcalo como cargado.</p>';
  return out;
}

function vAgenda(){
  const y=S.calY,m=S.calM;const first=new Date(y,m,1);const off=(first.getDay()+6)%7;const nd=new Date(y,m+1,0).getDate();
  const t=todayISO();const con={};for(let d=1;d<=nd;d++){const s=y+'-'+pad(m+1)+'-'+pad(d);if(S.eventos.some(e=>occursOn(e,s)))con[s]=1;if(S.fechas.some(f=>fechaOn(f,s)))con[s]=con[s]?3:2}
  let cells='';['L','M','M','J','V','S','D'].forEach(d=>cells+='<span class="dow" aria-hidden="true">'+d+'</span>');
  for(let i=0;i<off;i++)cells+='<span></span>';
  for(let d=1;d<=nd;d++){const s=y+'-'+pad(m+1)+'-'+pad(d);const cl=[con[s]===2?'dot dotv':con[s]?'dot':'',s<t?'past':'',s===t?'today':'',s===S.selDay?'sel':''].join(' ');
    cells+='<button class="'+cl+'" data-act="day" data-d="'+s+'" aria-label="'+d+' de '+MESES[m]+(con[s]?', con eventos':'')+'" aria-pressed="'+(s===S.selDay)+'"><span>'+d+'</span><i></i></button>'}
  const evs=S.eventos.filter(e=>occursOn(e,S.selDay)).sort((a,b)=>(a.hora||'')<(b.hora||'')?-1:1);
  const fds=S.fechas.filter(f=>fechaOn(f,S.selDay));
  const n=daysUntil(S.selDay);
  let out='<header class="between"><div class="col"><span class="muted" style="font-size:13px;font-weight:600">Agenda</span><h1>'+cap(MESES[m])+' '+y+'</h1></div><div class="row" style="gap:8px"><button class="iconbtn" data-act="calmes" data-d="-1" aria-label="Mes anterior">'+ICON.back+'</button><button class="iconbtn" data-act="calmes" data-d="1" aria-label="Mes siguiente">'+ICON.next+'</button></div></header>';
  out+='<section class="card" style="border-radius:26px;padding:14px 10px"><div class="cal">'+cells+'</div></section>';
  out+='<section class="list"><h2>'+(n===0?'Hoy · ':n===1?'Mañana · ':'')+esc(longDate(S.selDay))+'</h2>';
  out+=fds.map(f=>'<button class="item" style="border:0;text-align:left;width:100%" data-act="fecha" data-id="'+f.id+'"><span style="width:4px;align-self:stretch;border-radius:4px;background:var(--violet)" aria-hidden="true"></span><span class="col" style="flex:1"><span style="font-size:13px;font-weight:800;color:var(--violet)">Fecha importante</span><span style="font-weight:700">'+esc(f.titulo)+'</span>'+(f.anio?'<span class="muted" style="font-size:12px">Cumple '+(parseISO(S.selDay).getFullYear()-f.anio)+'</span>':'')+'</span></button>').join('');
  out+=evs.length?evs.map(e=>'<button class="item" style="border:0;text-align:left;width:100%" data-act="evento" data-id="'+e.id+'"><span style="width:4px;align-self:stretch;border-radius:4px;background:var(--blue)" aria-hidden="true"></span><span class="col" style="flex:1"><span class="num" style="font-size:13px;font-weight:800;color:var(--blue)">'+esc(e.hora||'Todo el día')+'</span><span style="font-weight:700">'+esc(e.titulo)+'</span>'+((e.repite&&e.repite!=='NO')||e.nota?'<span class="muted" style="font-size:12px">'+[e.repite&&e.repite!=='NO'?repLabel(e.repite):'',e.nota?esc(e.nota):''].filter(Boolean).join(' · ')+'</span>':'')+'</span></button>').join(''):(fds.length?'':'<div class="empty">Día libre. Tocá + para anotar algo.</div>');
  out+='</section>';
  return out;
}

function vAvisos(){
  const pv=pendVenc();const pagados=S.venc.filter(v=>v.pagado);
  const g=[['Vencidos y esta semana','var(--red)','rgba(255,138,122,.14)',v=>daysUntil(v.fecha)<=7],['Este mes','var(--amber)','rgba(255,200,87,.14)',v=>{const n=daysUntil(v.fecha);return n>7&&n<=31}],['Más adelante','var(--teal)','rgba(127,217,192,.14)',v=>daysUntil(v.fecha)>31]];
  let out='<header class="between"><div class="col"><span class="muted" style="font-size:13px;font-weight:600">Tus pagos y trámites</span><h1>Vencimientos</h1></div><button class="iconbtn" style="background:var(--orange);color:#1E140B" data-act="venc" aria-label="Agregar vencimiento">'+ICON.plus+'</button></header>';
  const sem=pv.filter(g[0][3]).length;
  out+='<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">'+[[sem,'Esta semana','var(--red)'],[pv.length,'Pendientes','var(--amber)'],[S.venc.filter(v=>v.ultimoPago===todayISO()||v.pagado).length,'Pagados hoy','var(--lime)']].map(s=>'<div class="card" style="border-radius:18px;padding:12px"><div class="num" style="font-size:24px;font-weight:800;color:'+s[2]+'">'+s[0]+'</div><div class="muted" style="font-size:12px;font-weight:600">'+s[1]+'</div></div>').join('')+'</div>';
  if(!S.ready)return out+'<div class="spin" role="status" aria-label="Cargando"></div>';
  if(!S.venc.length)return out+'<div class="empty"><span>Anotá impuestos, servicios, seguros o trámites y la app te los ordena por urgencia.</span><button class="btn" style="background:var(--orange);color:var(--ink)" data-act="venc">'+ICON.plus+'Agregar vencimiento</button></div>';
  g.forEach(gr=>{const its=pv.filter(gr[3]);if(!its.length)return;
    out+='<section class="list"><h2 class="row" style="gap:8px;font-size:15px"><span class="sw" style="background:'+gr[1]+';border-radius:99px" aria-hidden="true"></span>'+gr[0]+'</h2>'+its.map(v=>vencRow(v,gr[1],gr[2])).join('')+'</section>'});
  if(pagados.length)out+='<section class="list"><h2 class="muted" style="font-size:15px">Pagados</h2>'+pagados.map(v=>vencRow(v,'var(--muted)','var(--surface2)')).join('')+'</section>';
  return out;
}
function vencRow(v,c,tint){const d=parseISO(v.fecha);const n=daysUntil(v.fecha);
  const rep=v.repite==='MONTHLY'?'Todos los meses':v.repite==='YEARLY'?'Una vez por año':'Una sola vez';
  return '<div class="item" style="opacity:'+(v.pagado?.55:1)+'"><button class="item-main" data-act="venc" data-id="'+v.id+'"><span class="datechip" style="background:'+tint+';color:'+c+'"><b class="num">'+d.getDate()+'</b><span>'+MES3[d.getMonth()]+'</span></span><span class="col"><span style="font-weight:700;'+(v.pagado?'text-decoration:line-through':'')+'" class="ellip">'+esc(v.titulo)+'</span><span class="muted ellip" style="font-size:12px">'+(v.pagado?'Pagado':esc(cuando(n)))+(v.monto?' · '+money(v.monto):'')+' · '+rep+'</span></span></button>'+
  (v.pagado?'<button class="btn btn-sm btn-line" data-act="despagar" data-id="'+v.id+'">Deshacer</button>':'<button class="btn btn-sm btn-line" data-act="pagar" data-id="'+v.id+'">Ya pagué</button>')+'</div>'}

function vFechas(){
  const fs=fechasOrd();
  let out='<header class="row"><button class="iconbtn" data-go="inicio" aria-label="Volver al inicio">'+ICON.back+'</button><h1 style="flex:1;font-size:24px">Fechas importantes</h1><button class="iconbtn" style="background:var(--violet);color:var(--violet-ink)" data-act="fecha" aria-label="Agregar fecha">'+ICON.plus+'</button></header>';

  out+='<div class="list">'+fs.map(f=>'<button class="item" style="border:0;text-align:left;width:100%" data-act="fecha" data-id="'+f.id+'"><span style="width:56px;height:56px;flex-shrink:0;border-radius:18px;background:rgba(196,167,255,.14);color:var(--violet);display:flex;flex-direction:column;align-items:center;justify-content:center"><b class="num" style="font-size:20px;line-height:1">'+(f.faltan===0?'Hoy':f.faltan)+'</b>'+(f.faltan===0?'':'<span style="font-size:11px;font-weight:700">'+(f.faltan===1?'día':'días')+'</span>')+'</span><span class="col" style="flex:1"><span style="font-weight:700">'+esc(f.titulo)+'</span><span class="muted" style="font-size:13px">'+esc(longDate(f.prox))+(f.anio?' · cumple '+(parseISO(f.prox).getFullYear()-f.anio):'')+'</span></span></button>').join('')+'</div>';
  out+='<p class="note" style="margin:0">Para que te avise, entrá a cada fecha y tocá "Agregar alerta en Google Calendar". Se repite todos los años.</p>';
  return out;
}

/* ---------- QR ---------- */
async function decodeFile(file){
  if(!window.jsQR)return null;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const max of [1400,900,2200]){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
      const r=window.jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(r&&r.data)return r.data;
    }
    return null;
  }catch(e){return null}finally{URL.revokeObjectURL(url)}
}
function parseArca(text){
  try{let p=null;
    try{p=new URL(text).searchParams.get('p')}catch(e){const m=String(text).match(/[?&]p=([^&]+)/);p=m?decodeURIComponent(m[1]):null}
    if(!p)return null;p=p.replace(/\s/g,'+').replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';
    const j=JSON.parse(atob(p));if(!j||!j.cuit)return null;
    const cuit=String(j.cuit);const prev=S.tickets.find(t=>String(t.cuit).replace(/\D/g,'')===cuit&&t.razon);
    return{fecha:j.fecha,cuit,razon:prev?prev.razon:'',tipo:String(j.tipoCmp),pv:String(j.ptoVta||'').padStart(4,'0'),nro:String(j.nroCmp||'').padStart(8,'0'),monto:Number(j.importe)||0,rubro:prev?prev.rubro:undefined};
  }catch(e){return null}
}
async function onFile(file){
  if(!file)return;
  openSheet('Leyendo el ticket','<div class="spin" role="status" aria-label="Leyendo"></div><p class="note" style="margin:0;text-align:center">Buscando el código QR…</p>');
  const txt=await decodeFile(file);
  if(!txt)return sheetTicketForm({},null,{t:'No encontré un QR en la foto. Probá con otra más cerca y con luz, o completá los datos a mano.'});
  const d=parseArca(txt);
  if(!d)return sheetTicketForm({},null,{t:'Leí un QR, pero no es de una factura de ARCA. Completá los datos a mano.'});
  sheetTicketForm(d,null,{ok:1,t:'Datos leídos del QR. Revisá y elegí el rubro.'});
}

/* ---------- live camera ---------- */
let stream=null,scanLoop=null;
function stopScan(){if(scanLoop)cancelAnimationFrame(scanLoop);scanLoop=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function liveScan(){
  openSheet('Escanear QR','<div class="scanner"><video id="vid" playsinline muted></video><div class="frame" aria-hidden="true"></div></div><p class="note" id="scanMsg" style="margin:0;text-align:center">Apuntá al código QR del ticket.</p>');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false})}
  catch(e){return sheetScanFail()}
  const v=$('#vid');if(!v){stopScan();return}v.srcObject=stream;try{await v.play()}catch(e){}
  const c=document.createElement('canvas');const x=c.getContext('2d',{willReadFrequently:true});let last=0;
  const tick=t=>{scanLoop=requestAnimationFrame(tick);if(t-last<180||!v.videoWidth||!window.jsQR)return;last=t;
    const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
    x.drawImage(v,0,0,c.width,c.height);const r=window.jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
    if(r&&r.data){const d=parseArca(r.data);if(d){stopScan();if(navigator.vibrate)navigator.vibrate(80);sheetTicketForm(d,null,{ok:1,t:'Datos leídos del QR. Revisá y elegí el rubro.'})}else{const m=$('#scanMsg');if(m)m.textContent='Ese QR no es de una factura de ARCA. Probá con otro.'}}};
  scanLoop=requestAnimationFrame(tick);
}

async function exportData(){

  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Respaldo de Ordenado'});ls.set('lastBackup',Date.now());closeSheet();toast('Copia lista');render();return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  ls.set('lastBackup',Date.now());closeSheet();toast('Copia guardada en Descargas');render();

document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());const id=f.dataset.id||null;const kind=f.dataset.form;
  let k,data,msg;
  if(kind==='ticket'){const monto=parseMoney(fd.monto);const cuit=fd.cuit.replace(/\D/g,'');
    if(cuit.length!==11)return toast('El CUIT tiene que tener 11 números');if(monto==null)return toast('Revisá el monto');
    k='tickets';data={cuit,razon:fd.razon.trim(),tipo:fd.tipo,pv:fd.pv.replace(/\D/g,'').padStart(4,'0'),nro:fd.nro.replace(/\D/g,'').padStart(8,'0'),fecha:fd.fecha,monto,rubro:fd.rubro};
    if(!fd.pv)data.pv='';if(!fd.nro)data.nro='';ls.set('rubro',fd.rubro);if(!id){data.cargado=false;S.tkMonth=fd.fecha.slice(0,7)}msg='Ticket guardado'}
  if(kind==='evento'){k='eventos';data={titulo:fd.titulo.trim(),fecha:fd.fecha,hora:fd.hora||'',repite:fd.repite||'NO',nota:fd.nota.trim()};msg='Recordatorio guardado'}
  if(kind==='venc'){k='venc';data={titulo:fd.titulo.trim(),fecha:fd.fecha,monto:parseMoney(fd.monto),repite:fd.repite};if(!id)data.pagado=false;msg='Vencimiento guardado'}
  if(kind==='fecha'){k='fechas';const d=parseISO(fd.fecha);data={titulo:fd.titulo.trim(),dia:d.getDate(),mes:d.getMonth()+1,anio:fd.conAnio?d.getFullYear():null};msg='Fecha guardada'}
  const ok=await safe(()=>id?store.update(k,id,data):store.add(k,data),msg);
  if(ok){closeSheet();if(kind==='ticket'&&S.view!=='tickets')go('tickets')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});

/* ---------- start ---------- */
const sv=ls.get('view','inicio');if(VIEWS[sv])S.view=sv;
Object.keys(COLS).forEach(k=>{S[k]=ls.get('data-'+k,[])});S.ready=true;
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
