<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ordenado</title>
<meta name="theme-color" content="#0F1115">
<meta name="description" content="Tickets para SiRADIG, agenda, vencimientos y fechas importantes.">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/icon-192.png?v=2">
<style>@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}</style>
<style>
/* Layout: one-screen phone app — scrolling view above a fixed bottom nav; forms open as bottom sheets. Deliberately single dark theme. */
:root{
  --bg:#0F1115; --surface:#1A1D23; --surface2:#262A31; --line:#2E333B; --nav:#13161B;
  --fg:#F2F2EE; --muted:#9AA0A8; --ink:#14161A;
  --lime:#C6F36B; --blue:#8AB4FF; --violet:#C4A7FF; --violet-ink:#17112A;
  --orange:#FFB066; --red:#FF8A7A; --amber:#FFC857; --teal:#7FD9C0;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.view{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:800}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.card{background:var(--surface);border-radius:22px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg,.btn svg,.navb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:48px;border-radius:16px;border:0;padding:0 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ghost{background:var(--surface2);color:var(--fg)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn-danger{background:transparent;border:1px solid #5A2E29;color:var(--red)}
.btn-sm{min-height:40px;border-radius:12px;padding:0 12px;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:6px 0;font-weight:800;font-size:13px;color:var(--lime)}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--surface2);color:#D6DAE0;white-space:nowrap}
.empty{text-align:center;padding:22px 16px;color:var(--muted);background:var(--surface);border-radius:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datechip{width:50px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:14px}
.datechip b{font-size:18px;line-height:1.1}
.datechip span{font-size:11px;font-weight:700;text-transform:uppercase}

/* Home blocks */
.urgent{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:#2A1F17;border:1px solid #4A3322}
.hero{background:var(--violet);color:var(--violet-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .count{display:flex;flex-direction:column;align-items:center;justify-content:center;width:104px;height:104px;flex-shrink:0;border-radius:28px;background:var(--violet-ink);color:var(--violet)}
.hero .count b{font-size:50px;line-height:1;letter-spacing:-.03em}
.hero .mini{background:rgba(23,17,42,.1);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left;color:inherit}
.tile{border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:140px;border:0;text-align:left}
.tile .big{font-size:26px;font-weight:800;line-height:1}

/* Nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);border-top:1px solid #23272E;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.navb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;background:none;border:0;color:#8D939C;font-size:11px;font-weight:600}
.navb[aria-current="page"]{color:var(--lime);font-weight:800}
.navb svg{width:22px;height:22px}
.scanb{justify-self:center;width:60px;height:60px;margin-top:-30px;border-radius:20px;border:0;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(198,243,107,.25)}
.scanb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:20px;border:0;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

/* Segmented, filters */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:#C9CDD3;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal button{height:44px;border-radius:14px;border:0;background:transparent;color:var(--fg);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cal button i{width:5px;height:5px;border-radius:99px;background:transparent}
.cal button.dot i{background:var(--blue)}
.cal button.dotv i{background:var(--violet)}
.cal button.past{color:#6E747D}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cal button.sel{background:var(--blue);color:var(--bg)}
.cal button.sel i{background:var(--bg)}

/* Bars */
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:3px;background:var(--surface2)}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,6,8,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#C9CDD3}
.f input,.f select{min-height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 14px;font-size:16px;font-weight:600;color:var(--fg);width:100%}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.option{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:0;text-align:left;width:100%;cursor:pointer}
.option input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.copyrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.copyrow:last-child{border-bottom:0}
.copyrow .v{font-size:15px;font-weight:700;user-select:all;-webkit-user-select:all}
.copybtn{min-width:44px;height:44px;border-radius:14px;border:0;background:var(--surface2);color:#D6DAE0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:12px;font-weight:800}

.tcheck{width:30px;height:30px;flex-shrink:0;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.tcheck.on{background:var(--lime);border-color:var(--lime)}
.tcheck:not(.on):hover{border-color:var(--lime)}
.prio{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--orange);margin-right:7px;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lockscr{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.lockbox{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:16px}
.lockico{width:72px;height:72px;border-radius:24px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center}
.copybtn.ok{background:var(--lime);color:var(--ink)}
.copybtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.spin{width:36px;height:36px;border-radius:99px;border:4px solid var(--surface2);border-top-color:var(--lime);animation:sp 1s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
body{margin:0}
#main{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.scanner{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:3/4;max-width:100%}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scanner .frame{position:absolute;inset:18%;border:4px solid var(--lime);border-radius:26px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
@media print{
  body,html{height:auto;overflow:visible;background:#fff}
  #main,nav.bar,#fab,#toastHost{display:none!important}
  #sheetHost .scrim{position:static;background:none;display:block}
  #sheetHost .sheet{max-height:none;overflow:visible;border:0;padding:0;background:#fff;max-width:none}
  #sheetHost .sheet>*:not(.recibo){display:none!important}
  .recibo{border-radius:0!important;padding:0!important}
}
</style>
</head>
<body>
<div class="app">
  <main id="main" aria-live="polite"></main>
  <nav class="bar" aria-label="Navegación principal">
    <button class="navb" data-go="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="navb" data-go="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="scanb" data-act="quick" aria-label="Agregar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="navb" data-go="tareas"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l3 3 5-6"/></svg>Tareas</button>
    <button class="navb" data-go="avisos"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>Avisos</button>
  </nav>
  <div id="fab"></div>
  <div id="sheetHost"></div>
  <div id="toastHost"></div>
</div>

<script src="capacitor.js"></script>
<script src="jsQR.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="fb/firebase-app-compat.js"></script>
<script src="fb/firebase-auth-compat.js"></script>
<script src="fb/firebase-firestore-compat.js"></script>
<script>
(function(){
const APP_VERSION='__APP_VERSION__';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const todayISO=()=>iso(new Date());
const daysUntil=s=>Math.round((parseISO(s)-today0())/86400000);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtDate=s=>{const d=parseISO(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const longDate=s=>{const d=parseISO(s);return cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()]};
const fmtCuit=c=>{c=String(c||'').replace(/\D/g,'');return c.length===11?c.slice(0,2)+'-'+c.slice(2,10)+'-'+c.slice(10):c};
const money=n=>{n=Number(n)||0;const dec=Math.round(n*100)%100!==0;return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:2})};
const parseMoney=s=>{s=String(s||'').trim().replace(/[$\s]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=Number(s.replace(/[^\d.]/g,''));return isNaN(n)?null:n};
const cuando=n=>n<0?('Venció hace '+(-n)+(n===-1?' día':' días')):n===0?'Hoy':n===1?'Mañana':'En '+n+' días';
const addMonths=(s,k)=>{const d=parseISO(s);const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)};
const uid=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem('ordenado-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ordenado-'+k,JSON.stringify(v))}catch(e){}}};

const ICON={
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg>',
 cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 img:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8.5"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
 receipt:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 gift:'<svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8z"/></svg>',
 warn:'<svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
 bell:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>'
};

const TIPOS={'1':'Factura A','2':'Nota de débito A','3':'Nota de crédito A','6':'Factura B','7':'Nota de débito B','8':'Nota de crédito B','11':'Factura C','12':'Nota de débito C','13':'Nota de crédito C','51':'Factura M','81':'Tique factura A','82':'Tique factura B','83':'Tique','111':'Tique factura C'};
const RUBROS=['Gastos médicos y paramédicos','Cuotas de medicina prepaga','Alquiler de vivienda','Gastos de educación','Indumentaria y equipamiento de trabajo','Servicio doméstico','Primas de seguro','Intereses de crédito hipotecario','Otro'];
const RCOL=['#8AB4FF','#C6F36B','#C4A7FF','#FFC857','#FFB066','#7FD9C0','#FF8A7A','#D6DAE0','#6E747D'];
const rcol=r=>RCOL[Math.max(0,RUBROS.indexOf(r))];

/* ---------- state + store ---------- */
const COLS={tickets:'tickets',eventos:'eventos',venc:'vencimientos',fechas:'fechas',tareas:'tareas'};
const now=new Date();
const S={tickets:[],eventos:[],venc:[],fechas:[],tareas:[],ready:false,view:'inicio',
  calY:now.getFullYear(),calM:now.getMonth(),selDay:todayISO(),
  tkMonth:todayISO().slice(0,7),tkFilter:'todos'};
let db=null;

function saveLocal(k){ls.set('data-'+k,S[k])}
const store={
  async add(k,data){data.creado=Date.now();data.id=uid();S[k].push(data);saveLocal(k);render();if(typeof cloudSetItem==='function')cloudSetItem(k,data)},
  async update(k,id,patch){const it=S[k].find(x=>x.id===id);if(it)Object.assign(it,patch);saveLocal(k);render();if(it&&typeof cloudSetItem==='function')cloudSetItem(k,it)},
  async remove(k,id){S[k]=S[k].filter(x=>x.id!==id);saveLocal(k);render();if(typeof cloudDelItem==='function')cloudDelItem(k,id)}
};
async function safe(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio. Borrá registros viejos para seguir guardando.':'No se pudo guardar. Revisá la conexión y probá de nuevo.');return false}}

/* ---------- derived ---------- */
const pendVenc=()=>S.venc.filter(v=>!v.pagado).sort((a,b)=>a.fecha<b.fecha?-1:1);
function nextFecha(f){const t=today0();let d=new Date(t.getFullYear(),f.mes-1,f.dia);if(d<t)d=new Date(t.getFullYear()+1,f.mes-1,f.dia);return d}
const fechasOrd=()=>S.fechas.map(f=>{const d=nextFecha(f);return Object.assign({},f,{prox:iso(d),faltan:Math.round((d-today0())/86400000)})}).sort((a,b)=>a.faltan-b.faltan);
const REPITE=[['NO','No se repite'],['DAILY','Todos los días'],['WEEKLY','Todas las semanas'],['MONTHLY','Todos los meses'],['YEARLY','Todos los años']];
const repLabel=r=>(REPITE.find(x=>x[0]===r)||REPITE[0])[1];
function occursOn(e,s){
  if(!e.fecha||s<e.fecha)return false;const r=e.repite||'NO';if(r==='NO')return s===e.fecha;if(r==='DAILY')return true;
  const a=parseISO(e.fecha),b=parseISO(s);
  if(r==='WEEKLY')return a.getDay()===b.getDay();
  const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();const dd=Math.min(a.getDate(),last);
  if(r==='MONTHLY')return b.getDate()===dd;
  if(r==='YEARLY')return a.getMonth()===b.getMonth()&&b.getDate()===dd;return false}
const fechaOn=(f,s)=>{const b=parseISO(s);return b.getMonth()+1===Number(f.mes)&&b.getDate()===Number(f.dia)};
function eventosFuturos(){const t=todayISO();const hm=pad(new Date().getHours())+':'+pad(new Date().getMinutes());const out=[];
  S.eventos.forEach(e=>{let d=parseISO(e.fecha>t?e.fecha:t);
    for(let i=0;i<400;i++){const s=iso(d);if(occursOn(e,s)&&(s>t||!e.hora||e.hora>=hm)){out.push(Object.assign({},e,{fecha:s}));break}if((e.repite||'NO')==='NO'&&s>=e.fecha)break;d.setDate(d.getDate()+1)}});
  return out.sort((a,b)=>(a.fecha+(a.hora||'00:00'))<(b.fecha+(b.hora||'00:00'))?-1:1)}
const tkDelMes=m=>S.tickets.filter(t=>(t.fecha||'').slice(0,7)===m);

function gcal(o){
  let s,e;const c=o.fecha.replace(/-/g,'');
  if(o.hora){const d=parseISO(o.fecha);const [h,mi]=o.hora.split(':').map(Number);d.setHours(h,mi);const f=new Date(d.getTime()+3600000);
    const st=x=>iso(x).replace(/-/g,'')+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';s=st(d);e=st(f)}
  else{const n=parseISO(o.fecha);n.setDate(n.getDate()+1);s=c;e=iso(n).replace(/-/g,'')}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(o.titulo)+'&dates='+s+'/'+e+'&ctz=America/Argentina/Buenos_Aires'+(o.recur?'&recur='+encodeURIComponent('RRULE:FREQ='+o.recur):'')+(o.detalle?'&details='+encodeURIComponent(o.detalle):'');
}
const gcalBtn=o=>(typeof NP!=='undefined'&&NP)?'':'<a class="btn btn-line" href="'+esc(gcal(o))+'" target="_blank" rel="noopener">'+ICON.bell+'Agregar alerta en Google Calendar</a>';

/* ---------- QR ---------- */
async function decodeFile(file){
  if(!window.jsQR)return null;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const max of [1400,900,2200]){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
      const r=window.jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(r&&r.data)return r.data;
    }
    return null;
  }catch(e){return null}finally{URL.revokeObjectURL(url)}
}
function parseArca(text){
  try{let p=null;
    try{p=new URL(text).searchParams.get('p')}catch(e){const m=String(text).match(/[?&]p=([^&]+)/);p=m?decodeURIComponent(m[1]):null}
    if(!p)return null;p=p.replace(/\s/g,'+').replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';
    const j=JSON.parse(atob(p));if(!j||!j.cuit)return null;
    const cuit=String(j.cuit);const prev=S.tickets.find(t=>String(t.cuit).replace(/\D/g,'')===cuit&&t.razon);
    return{fecha:j.fecha,cuit,razon:prev?prev.razon:'',tipo:String(j.tipoCmp),pv:String(j.ptoVta||'').padStart(4,'0'),nro:String(j.nroCmp||'').padStart(8,'0'),monto:Number(j.importe)||0,rubro:prev?prev.rubro:undefined};
  }catch(e){return null}
}
async function onFile(file){
  if(!file)return;
  openSheet('Leyendo el ticket','<div class="spin" role="status" aria-label="Leyendo"></div><p class="note" style="margin:0;text-align:center">Buscando el código QR…</p>');
  const txt=await decodeFile(file);
  if(!txt)return sheetTicketForm({},null,{t:'No encontré un QR en la foto. Probá con otra más cerca y con luz, o completá los datos a mano.'});
  const d=parseArca(txt);
  if(!d)return sheetTicketForm({},null,{t:'Leí un QR, pero no es de una factura de ARCA. Completá los datos a mano.'});
  sheetTicketForm(d,null,{ok:1,t:'Datos leídos del QR. Revisá y elegí el rubro.'});
}

async function liveScan(){

  catch(e){return sheetScanFail()}

  const c=document.createElement('canvas');const x=c.getContext('2d',{willReadFrequently:true});let last=0;
  const tick=t=>{scanLoop=requestAnimationFrame(tick);if(t-last<180||!v.videoWidth||!window.jsQR)return;last=t;
    const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);

  scanLoop=requestAnimationFrame(tick);
}

async function importData(file){

    const add=(k,arr)=>{const ids=new Set(S[k].map(x=>x.id));(arr||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id))S[k].push(x)});saveLocal(k)};

const BRK=['Menos de 12 horas semanales','De 12 a menos de 16 horas semanales','16 horas semanales o más'];
const bracket=h=>{h=Number(h)||0;return h<12?0:h<16?1:2};
const r2=n=>Math.round((Number(n)||0)*100)/100;
const lastDay=p=>{const [y,m]=p.split('-').map(Number);return iso(new Date(y,m,0))};
function aniosEntre(a,b){if(!a)return 0;if(a<'2020-09-01')a='2020-09-01';const x=parseISO(a),y=parseISO(b);let n=y.getFullYear()-x.getFullYear();if(y.getMonth()<x.getMonth()||(y.getMonth()===x.getMonth()&&y.getDate()<x.getDate()))n--;return Math.max(0,n)}
function numLetras(n){
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const dos=x=>x<30?U[x]:D[Math.floor(x/10)]+(x%10?' y '+U[x%10]:'');
  const tres=x=>x===100?'cien':(C[Math.floor(x/100)]+(x%100?(x>=100?' ':'')+dos(x%100):'')).trim();
  const apoc=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const mil=x=>{if(x<1000)return tres(x);const m=Math.floor(x/1000),r=x%1000;return (m===1?'mil':apoc(tres(m))+' mil')+(r?' '+tres(r):'')};
  const ent=Math.floor(n+1e-9);let s;
  if(ent===0)s='cero';else if(ent<1e6)s=mil(ent);else{const mm=Math.floor(ent/1e6),r=ent%1e6;s=(mm===1?'un millón':apoc(mil(mm))+' millones')+(r?' '+mil(r):'')}
  const cts=Math.round((n-ent)*100);
  return 'Pesos '+s+' con '+pad(cts)+'/100';
}
function calcSueldo(emp,f,excludeId){
  const E=getEsc();const c=((E.cat[emp.categoria]||E.cat.generales)[emp.modalidad==='sin'?'sin':'con']);
  const vh=Number(c[0]),vm=Number(c[1]);
  const horasMes=Number(String(f.horasMes||'').replace(',','.'))||0;
  const remu=parseMoney(f.remu);
  const basico=r2(emp.forma==='mes'?(remu!=null?remu:(Number(emp.sueldo)||vm)):vh*horasMes);
  const anios=aniosEntre(emp.ingreso,lastDay(f.periodo));
  const antig=r2(basico*anios/100);
  const zona=r2(emp.zona?basico*Number(E.zona)/100:0);
  const h50=Number(String(f.h50||'').replace(',','.'))||0,h100=Number(String(f.h100||'').replace(',','.'))||0;
  const ext50=r2(vh*1.5*h50),ext100=r2(vh*2*h100);
  const otro=r2(parseMoney(f.otroMonto)||0);
  const sinSac=r2(basico+antig+zona+ext50+ext100+otro);
  let sac=0,sacBase=0;
  if(f.sac){const [y,m]=f.periodo.split('-').map(Number);const desde=m<=6?1:7;
    const prev=(ls.get('recibos',[])).filter(r=>r.id!==excludeId&&r.periodo.slice(0,4)===String(y)&&Number(r.periodo.slice(5))>=desde&&Number(r.periodo.slice(5))<=m).map(r=>Number(r.sinSac)||0);
    sacBase=Math.max(sinSac,...prev,0);sac=r2(sacBase/2)}
  const bruto=r2(sinSac+sac);const br=bracket(emp.horasSem);const a=E.ap[br];
  const aporte=r2(f.aporte&&!emp.jubilada?Number(a.os):0);const otroDesc=r2(parseMoney(f.descMonto)||0);const desc=r2(aporte+otroDesc);const neto=r2(bruto-desc);
  const vep=r2(emp.jubilada?Number(a.art)+Number(a.sipa):Number(a.os)+Number(a.art)+Number(a.sipa));
  return {vh,vm,horasMes,basico,anios,antig,zona,zonaPct:E.zona,h50,h100,ext50,ext100,otro,otroConcepto:(f.otroConcepto||'').trim(),sinSac,sac,sacBase,bruto,aporte,otroDesc,desc,descConcepto:(f.descConcepto||'').trim(),neto,br,ap:a,vep,escVig:E.vigencia,apVig:E.apVig};
}

  if(c.antig)rows.push(['Antigüedad ('+c.anios+(c.anios===1?' año':' años')+' × 1%)',c.antig]);
  if(c.zona)rows.push(['Zona desfavorable ('+c.zonaPct+'%)',c.zona]);

const SYNC_KEYS=['empleada','empleador','escala','avisos','recibos'];

function cleanDoc(o){const r={};for(const x in o){if(x!=='id'&&o[x]!==undefined)r[x]=o[x]}return r}
function cloudWrite(fn){if(!fbUser||!fbDb)return;try{Promise.resolve(fn()).catch(e=>console.log('nube',e))}catch(e){console.log('nube',e)}}
function cloudSetItem(k,item){cloudWrite(()=>cloudCol(k).doc(item.id).set(cleanDoc(item)))}

function cloudPushAll(){if(!fbUser)return;Object.keys(COLS).forEach(k=>S[k].forEach(it=>{if(it&&it.id)cloudSetItem(k,it)}));pushMetaNow()}

function pushMetaNow(){if(!fbUser)return;const o={actualizado:Date.now()};SYNC_KEYS.forEach(k=>{const v=ls.get(k,null);o[k]=v===undefined?null:v});cloudWrite(()=>metaDoc().set(JSON.parse(JSON.stringify(o)),{merge:true}))}
{const _set=ls.set;ls.set=function(k,v){_set.call(ls,k,v);if(SYNC_KEYS.indexOf(k)>=0)pushMetaSoon()}}

function startCloud(){
  stopCloud();if(!fbUser)return;const uidK=fbUser.uid;
  Object.keys(COLS).forEach(k=>{
    const local=S[k].slice();const migKey='mig-'+uidK+'-'+k;let migrado=!!ls.get(migKey,false);
    cloudUnsubs.push(cloudCol(k).onSnapshot({includeMetadataChanges:true},snap=>{
      if(!migrado){if(snap.metadata.fromCache)return;
        const ids=new Set(snap.docs.map(d=>d.id));local.filter(x=>x&&x.id&&!ids.has(x.id)).forEach(x=>cloudSetItem(k,x));
        migrado=true;ls.set(migKey,true);
        if(local.some(x=>x&&x.id&&!ids.has(x.id)))return;}
      if(!snap.metadata.fromCache)cloudOk=true;
      S[k]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));saveLocal(k);render();
    },e=>{console.log('nube',e);cloudOk=false;render()}));
  });
  const metaMig='mig-'+uidK+'-meta';
  cloudUnsubs.push(metaDoc().onSnapshot({includeMetadataChanges:true},snap=>{
    if(!ls.get(metaMig,false)){if(snap.metadata.fromCache)return;
      const d=snap.exists?snap.data():{};const falta=SYNC_KEYS.some(k=>(d[k]==null)&&ls.get(k,null)!=null);
      ls.set(metaMig,true);if(falta){pushMetaNow();return}}
    if(!snap.exists||snap.metadata.hasPendingWrites)return;const d=snap.data();

const CAP=window.capacitorExports||null;
const isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=isNative&&CAP?{LN:CAP.registerPlugin('LocalNotifications'),FS:CAP.registerPlugin('Filesystem'),SH:CAP.registerPlugin('Share'),BIO:CAP.registerPlugin('NativeBiometric')}:null;
const AV_DEF={on:true,hora:'09:00',vencDias:2,fechaDias:3,eventoMin:30,resumen:true,resumenHora:'08:00',sueldo:true};
const avCfg=()=>Object.assign({},AV_DEF,ls.get('avisos',{}));
const AVISO_EV=[['-1','Sin aviso'],['0','A la hora'],['15','15 minutos antes'],['30','30 minutos antes'],['60','1 hora antes'],['120','2 horas antes'],['1440','1 día antes']];
let notifPerm=null,exactPerm=null;
function atTime(dayISO,hhmm){const d=parseISO(dayISO);const [h,m]=String(hhmm||'09:00').split(':').map(Number);d.setHours(h||0,m||0,0,0);return d}
function addDaysISO(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function buildNotifs(){
  const cfg=avCfg();if(!cfg.on)return[];
  const now=new Date();const t0=todayISO();const H=45;const out=[];
  const push=(at,title,body,view,day)=>{if(at>now)out.push({at,title,body,view,day})};
  // eventos
  S.eventos.forEach(e=>{const av=e.aviso!=null?Number(e.aviso):cfg.eventoMin;if(av<0)return;
    for(let i=-1;i<=H;i++){const s=addDaysISO(t0,i);if(!occursOn(e,s))continue;
      let at,body;
      if(e.hora){at=new Date(atTime(s,e.hora).getTime()-av*60000);body=(av>=1440?'Mañana':av===0?'Ahora':'Hoy')+' a las '+e.hora}
      else{at=atTime(av>=1440?addDaysISO(s,-1):s,cfg.hora);body=av>=1440?'Mañana, todo el día':'Hoy, todo el día'}
      if(e.nota)body+=' · '+e.nota;push(at,e.titulo,body,'agenda',s)}});
  // vencimientos
  S.venc.filter(v=>!v.pagado&&v.fecha).forEach(v=>{const m=v.monto?' · '+money(v.monto):'';
    if(v.fecha<t0){push(atTime(addDaysISO(t0,1),cfg.hora),'Vencido: '+v.titulo,'Venció el '+fmtDate(v.fecha)+m+'. Tocá para marcarlo pagado.','avisos');return}
    if(cfg.vencDias>0)push(atTime(addDaysISO(v.fecha,-cfg.vencDias),cfg.hora),'Vence en '+cfg.vencDias+(cfg.vencDias===1?' día':' días')+': '+v.titulo,'El '+fmtDate(v.fecha)+m,'avisos');
    push(atTime(v.fecha,cfg.hora),'Vence hoy: '+v.titulo,(v.monto?money(v.monto)+'. ':'')+'Cuando lo pagues, tocá "Ya pagué".','avisos')});
  // fechas importantes
  S.fechas.forEach(f=>{const p=iso(nextFecha(f));const edad=f.anio?' (cumple '+(parseISO(p).getFullYear()-f.anio)+')':'';
    if(cfg.fechaDias>0)push(atTime(addDaysISO(p,-cfg.fechaDias),cfg.hora),'En '+cfg.fechaDias+(cfg.fechaDias===1?' día':' días')+': '+f.titulo,longDate(p)+edad,'fechas');
    push(atTime(p,cfg.hora),'Hoy: '+f.titulo,'No te olvides de saludar'+edad.replace(' (',', ').replace(')',''),'fechas')});
  // sueldo empleada
  const emp=ls.get('empleada',null);
  if(emp&&cfg.sueldo){for(let k=0;k<2;k++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+k);const y=d.getFullYear(),mo=d.getMonth();
    const prev=MESES[(mo+11)%12];const nom=String(emp.nombre||'').split(' ')[0]||'la empleada';
    push(atTime(iso(new Date(y,mo,1)),cfg.hora),'Sueldo de '+nom,'Liquidá '+prev+' y armá el recibo en ARCA.','sueldo');
    push(atTime(iso(new Date(y,mo,8)),cfg.hora),'El 10 vence el VEP de casas particulares','Pagalo antes del 10 para no tener recargos.','sueldo')}}
  // tareas con fecha
  S.tareas.filter(x=>!x.hecha&&x.fecha&&x.fecha>=t0).forEach(x=>push(atTime(x.fecha,x.hora||cfg.hora),'Tarea: '+x.titulo,x.hora?'Hoy a las '+x.hora:(x.nota||'Para hoy'),'tareas'));
  // resumen diario
  if(cfg.resumen){for(let i=0;i<=14;i++){const s=addDaysISO(t0,i);
    const it=[];S.eventos.filter(e=>occursOn(e,s)).sort((a,b)=>(a.hora||'')<(b.hora||'')?-1:1).forEach(e=>it.push((e.hora?e.hora+' ':'')+e.titulo));
    S.venc.filter(v=>!v.pagado&&v.fecha===s).forEach(v=>it.push('vence '+v.titulo));
    S.fechas.filter(f=>fechaOn(f,s)).forEach(f=>it.push(f.titulo));
    S.tareas.filter(x=>!x.hecha&&x.fecha===s).forEach(x=>it.push(x.titulo));
    if(it.length)push(atTime(s,cfg.resumenHora),'Tu día: '+it.length+(it.length===1?' cosa':' cosas'),it.slice(0,5).join(' · ')+(it.length>5?' y más':''),'agenda',s)}}
  return out.sort((a,b)=>a.at-b.at).slice(0,150);
}
let schedT=null,lastSig='';
function scheduleSoon(){if(!NP)return;clearTimeout(schedT);schedT=setTimeout(scheduleNow,1200)}
async function scheduleNow(force){
  if(!NP)return;
  try{const st=await NP.LN.checkPermissions();notifPerm=st.display;if(notifPerm!=='granted')return;
    const list=buildNotifs();const sig=JSON.stringify(list.map(n=>[+n.at,n.title,n.body]));if(!force&&sig===lastSig)return;
    const pend=await NP.LN.getPending();if(pend.notifications&&pend.notifications.length)await NP.LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(list.length)await NP.LN.schedule({notifications:list.map((n,i)=>({id:i+1,title:n.title,body:n.body,largeBody:n.body,channelId:'ordenado',smallIcon:'ic_stat_ordenado',iconColor:'#C6F36B',schedule:{at:n.at,allowWhileIdle:true},extra:{view:n.view,day:n.day||null}}))});
    lastSig=sig;
  }catch(e){console.log('avisos',e)}
}

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function shareFile(name,blob,title){
  if(NP){const data=await blobToB64(blob);const w=await NP.FS.writeFile({path:name,data,directory:'CACHE'});await NP.SH.share({title,files:[w.uri],dialogTitle:title});return 'shared'}
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return 'downloaded';
}

/* ---------- buscador ---------- */
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function buscar(q){
  const w=norm(q).trim().split(/\s+/).filter(Boolean);if(!w.length)return[];
  const hit=(...f)=>{const h=norm(f.filter(x=>x!=null&&x!=='').join(' '));return w.every(x=>h.includes(x))};
  const num=n=>n?[String(n),String(Math.round(n)),money(n)].join(' '):'';
  const g=[];
  const add=(titulo,color,items)=>{if(items.length)g.push({titulo,color,items})};
  add('Tareas','var(--lime)',S.tareas.filter(x=>hit(x.titulo,x.nota)).sort((a,b)=>(a.hecha?1:0)-(b.hecha?1:0)).map(x=>({act:'tarea',id:x.id,t:x.titulo,m:(x.hecha?'Hecha':'Pendiente')+(x.fecha?' · '+fmtDate(x.fecha):'')})));
  add('Agenda','var(--blue)',S.eventos.filter(x=>hit(x.titulo,x.nota)).sort((a,b)=>a.fecha<b.fecha?1:-1).map(x=>({act:'evento',id:x.id,t:x.titulo,m:fmtDate(x.fecha)+(x.hora?' · '+x.hora:'')+(x.repite&&x.repite!=='NO'?' · '+repLabel(x.repite).toLowerCase():'')})));
  add('Vencimientos','var(--orange)',S.venc.filter(x=>hit(x.titulo,num(x.monto))).map(x=>({act:'venc',id:x.id,t:x.titulo,m:(x.pagado?'Pagado':'Vence el '+fmtDate(x.fecha))+(x.monto?' · '+money(x.monto):'')})));
  add('Fechas importantes','var(--violet)',S.fechas.filter(x=>hit(x.titulo)).map(x=>({act:'fecha',id:x.id,t:x.titulo,m:x.dia+' de '+MESES[x.mes-1]})));
  add('Tickets','var(--teal)',S.tickets.filter(x=>hit(x.razon,x.cuit,fmtCuit(x.cuit),x.rubro,num(x.monto),TIPOS[x.tipo],x.nro)).sort((a,b)=>a.fecha<b.fecha?1:-1).map(x=>({act:'ticket',id:x.id,t:x.razon||'CUIT '+fmtCuit(x.cuit),m:fmtDate(x.fecha)+' · '+money(x.monto)+' · '+x.rubro})));
  add('Recibos de sueldo','#D6DAE0',ls.get('recibos',[]).filter(r=>hit('recibo sueldo',r.emp&&r.emp.nombre,MESES[Number(r.periodo.slice(5))-1],r.periodo.slice(0,4),num(r.neto))).sort((a,b)=>a.periodo<b.periodo?1:-1).map(r=>({act:'recibo',id:r.id,t:'Recibo '+MESES[Number(r.periodo.slice(5))-1]+' '+r.periodo.slice(0,4),m:'Neto '+money(r.neto)})));
  return g;
}
function busqResultados(q){
  if(!norm(q).trim())return '<p class="note" style="margin:0">Buscá en todo: tareas, agenda, vencimientos, fechas, tickets y recibos. Podés buscar por nombre, comercio, CUIT o monto.</p>';

function reciboPDF(r){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('pdf');
  const doc=new J({unit:'mm',format:'a4'});const emp=r.emp||{},er=r.empleador||{};
  const L=18,R=192;let y=20;
  const txt=(s,x,yy,o)=>doc.text(String(s==null?'':s),x,yy,o||{});
  const per=cap(MESES[Number(r.periodo.slice(5))-1])+' '+r.periodo.slice(0,4);
  doc.setFont('helvetica','bold');doc.setFontSize(15);txt('Recibo de haberes',L,y);
  doc.setFontSize(10);txt('Período: '+per,R,y,{align:'right'});y+=6;
  doc.setFont('helvetica','normal');txt('Personal de casas particulares · Ley 26.844',L,y);txt('Fecha de pago: '+fmtDate(r.fechaPago),R,y,{align:'right'});
  y+=4;doc.setLineWidth(.6);doc.line(L,y,R,y);y+=7;
  const col2=105;
  doc.setFont('helvetica','bold');txt('Empleador',L,y);txt('Trabajadora',col2,y);y+=5;doc.setFont('helvetica','normal');
  const a=[er.nombre||'—','CUIT: '+(fmtCuit(er.cuit)||'—'),er.dom||''];
  const b=[emp.nombre||'—','CUIL: '+(fmtCuit(emp.cuil)||'—'),catLabel(emp.categoria)+', '+(emp.modalidad==='sin'?'sin retiro':'con retiro'),'Ingreso: '+(emp.ingreso?fmtDate(emp.ingreso):'—')+' · '+emp.horasSem+' h semanales'];
  for(let i=0;i<Math.max(a.length,b.length);i++){if(a[i])txt(a[i],L,y);if(b[i])txt(b[i],col2,y);y+=5}
  y+=2;doc.setLineWidth(.2);doc.line(L,y,R,y);y+=7;
  const c1=L+2,c2=150,c3=R-2;
  doc.setFillColor(238,238,238);doc.rect(L,y-5,R-L,8,'F');doc.setFont('helvetica','bold');
  txt('Concepto',c1,y);txt('Haberes',c2,y,{align:'right'});txt('Descuentos',c3,y,{align:'right'});y+=8;doc.setFont('helvetica','normal');
  const rows=liqRows(r,emp).map(x=>[x[0],money(x[1]),'']);
  if(r.aporte)rows.push(['Aporte obra social (Ley 25.239)','',money(r.aporte)]);
  const od=r.otroDesc!=null?r.otroDesc:(r.aporte?0:r.desc);if(od)rows.push([r.descConcepto||'Descuento','',money(od)]);
  rows.forEach(x=>{txt(x[0],c1,y);if(x[1])txt(x[1],c2,y,{align:'right'});if(x[2])txt(x[2],c3,y,{align:'right'});y+=3;doc.setDrawColor(220);doc.line(L,y,R,y);y+=5});
  doc.setFont('helvetica','bold');txt('Totales',c1,y);txt(money(r.bruto),c2,y,{align:'right'});txt(money(r.desc),c3,y,{align:'right'});y+=8;
  doc.setFillColor(238,238,238);doc.rect(L,y-6,R-L,10,'F');doc.setFontSize(12);txt('Neto a cobrar',c1,y);txt(money(r.neto),c3,y,{align:'right'});y+=10;
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  const son=doc.splitTextToSize('Son: '+numLetras(r.neto)+'.',R-L);son.forEach(l=>{txt(l,L,y);y+=5});
  y+=28;doc.setDrawColor(0);doc.line(L+5,y,L+70,y);doc.line(R-70,y,R-5,y);y+=5;
  txt('Firma del empleador',L+37.5,y,{align:'center'});txt('Firma de la trabajadora',R-37.5,y,{align:'center'});y+=12;
  doc.setFontSize(8);doc.setTextColor(110);
  doc.splitTextToSize('Recibí conforme el importe neto de esta liquidación. Documento de ayuda generado con Ordenado; el recibo oficial se emite en ARCA, servicio Personal de Casas Particulares.',R-L).forEach(l=>{txt(l,L,y);y+=4});
  return doc.output('blob');
}
async function compartirRecibo(id){
  const r=ls.get('recibos',[]).find(x=>x.id===id);if(!r)return;
  try{const blob=reciboPDF(r);const nom=String((r.emp&&r.emp.nombre)||'empleada').split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g,'');
    const res=await shareFile('recibo-'+nom+'-'+r.periodo+'.pdf',blob,'Recibo '+MESES[Number(r.periodo.slice(5))-1]+' '+r.periodo.slice(0,4));
    if(res==='downloaded')toast('PDF guardado en Descargas')}
  catch(e){toast('No se pudo armar el PDF')}
}

/* ---------- events ---------- */
document.addEventListener('change',e=>{if(e.target.id==='fileCam'||e.target.id==='fileGal')onFile(e.target.files&&e.target.files[0]);if(e.target.id==='importFile')importData(e.target.files&&e.target.files[0])});
let delArm=null;
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){if(sheetOpen)closeSheet();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='close'){if(e.target===a||a.classList.contains('iconbtn'))closeSheet();return}
  if(act==='scan')return sheetScan();
  if(act==='quick')return sheetQuick();
  if(act==='buscar')return sheetBuscar();
  if(act==='lock-on'||act==='lock-off'){return toggleLock(act==='lock-on').then(()=>{if(sheetOpen)sheetAjustes()})}
  if(act==='tarea')return sheetTarea(id);
  if(act==='tfilter'){S.tFilter=a.dataset.f;return render()}
  if(act==='tquick'){const el=document.getElementById('ta-fecha');if(el)el.value=a.dataset.d===''?'':addDaysISO(todayISO(),Number(a.dataset.d));return}
  if(act==='tcheck'){const x=S.tareas.find(z=>z.id===id);if(!x)return;if(a.dataset.close)closeSheet();return safe(()=>store.update('tareas',id,{hecha:!x.hecha,hechaEn:x.hecha?null:Date.now()}),x.hecha?'Vuelve a estar pendiente':'¡Hecha!')}
  if(act==='tclean'){if(delArm!==a){delArm=a;a.textContent='Tocá de nuevo para borrarlas';setTimeout(()=>{if(delArm===a){delArm=null;a.textContent='Borrar las tareas hechas'}},3000);return}
    delArm=null;const hechasIds=S.tareas.filter(x=>x.hecha).map(x=>x.id);S.tareas=S.tareas.filter(x=>!x.hecha);saveLocal('tareas');render();hechasIds.forEach(i=>cloudDelItem('tareas',i));return toast('Tareas hechas borradas')}
  if(act==='vermanana'){const m=addDaysISO(todayISO(),1);S.selDay=m;const d=parseISO(m);S.calY=d.getFullYear();S.calM=d.getMonth();return go('agenda')}
  if(act==='manual')return sheetTicketForm({});
  if(act==='live')return liveScan();
  if(act==='install')return doInstall();
  if(act==='backup'||act==='ajustes')return sheetAjustes();
  if(act==='pedir-avisos')return pedirAvisos();
  if(act==='nube-entrar'||act==='nube-crear'||act==='nube-reset'){const em=document.getElementById('nb-mail');if(em)ls.set('nubeMail',em.value.trim());return authDo(act.slice(5))}
  if(act==='nube-salir'){if(delArm!==a){delArm=a;a.textContent='Tocá de nuevo para cerrar sesión';setTimeout(()=>{if(delArm===a){delArm=null;a.textContent='Cerrar sesión'}},3000);return}delArm=null;try{fbAuth.signOut()}catch(e){}return toast('Sesión cerrada. Tus datos siguen en este celu.')}
  if(act==='pedir-exacto')return pedirExacto();
  if(act==='probar-aviso'){if(NP)NP.LN.schedule({notifications:[{id:9999,title:'Así te va a avisar Ordenado',body:'Los avisos están funcionando.',channelId:'ordenado',smallIcon:'ic_stat_ordenado',iconColor:'#C6F36B',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]}).then(()=>toast('En 5 segundos te llega un aviso')).catch(()=>toast('No se pudo programar'));return}
  if(act==='pdf')return compartirRecibo(id);
  if(act==='export')return exportData();
  if(act==='empleada')return sheetEmpleada();
  if(act==='escala')return sheetEscala();
  if(act==='escalaReset'){ls.set('escala',null);closeSheet();render();return toast('Volvieron los valores de la app')}
  if(act==='recibo')return sheetRecibo(id);
  if(act==='print'){try{window.print()}catch(e){toast('Tu navegador no deja imprimir desde acá')}return}
  if(act==='delrec'){if(delArm!==a){delArm=a;a.textContent='Tocá de nuevo para borrar';setTimeout(()=>{if(delArm===a){delArm=null;a.textContent='Borrar'}},3000);return}
    delArm=null;ls.set('recibos',ls.get('recibos',[]).filter(r=>r.id!==id));closeSheet();render();return toast('Recibo borrado')}
  if(act==='ticket')return sheetTicket(id);
  if(act==='tkedit'){const t=S.tickets.find(x=>x.id===id);return sheetTicketForm(t,id)}
  if(act==='evento')return sheetEvento(id);
  if(act==='venc')return sheetVenc(id);
  if(act==='fecha')return sheetFecha(id);
  if(act==='tkmes'){const [y,m]=S.tkMonth.split('-').map(Number);const d=new Date(y,m-1+Number(a.dataset.d),1);S.tkMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);return render()}
  if(act==='tkfilter'){S.tkFilter=a.dataset.f;return render()}
  if(act==='calmes'){const d=new Date(S.calY,S.calM+Number(a.dataset.d),1);S.calY=d.getFullYear();S.calM=d.getMonth();return render()}
  if(act==='day'){S.selDay=a.dataset.d;return render()}
  if(act==='tktoggle'){const t=S.tickets.find(x=>x.id===id);if(!t)return;if(a.dataset.close)closeSheet();return safe(()=>store.update('tickets',id,{cargado:!t.cargado}),t.cargado?'Marcado como pendiente':'Marcado como cargado en ARCA')}
  if(act==='pagar'){const v=S.venc.find(x=>x.id===id);if(!v)return;
    if(v.repite==='MONTHLY'||v.repite==='YEARLY'){const nf=addMonths(v.fecha,v.repite==='MONTHLY'?1:12);return safe(()=>store.update('venc',id,{fecha:nf,ultimoPago:todayISO()}),'Pagado. El próximo vence el '+fmtDate(nf))}
    return safe(()=>store.update('venc',id,{pagado:true,ultimoPago:todayISO()}),'Marcado como pagado')}
  if(act==='despagar')return safe(()=>store.update('venc',id,{pagado:false}),'Vuelve a estar pendiente');
  if(act==='copy'){const v=a.dataset.v;try{await navigator.clipboard.writeText(v);a.classList.add('ok');a.innerHTML=ICON.check+'Copiado';setTimeout(()=>{a.classList.remove('ok');a.innerHTML=ICON.copy},1800)}catch(err){const r=document.createRange();const el=a.parentElement.querySelector('.v');r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Mantené apretado el dato marcado para copiarlo')}return}
  if(act==='del'){if(delArm!==a){delArm=a;a.textContent='Tocá de nuevo para borrar';setTimeout(()=>{if(delArm===a){delArm=null;a.textContent='Borrar'}},3000);return}
    delArm=null;closeSheet();return safe(()=>store.remove(a.dataset.k,id),'Borrado')}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());const id=f.dataset.id||null;const kind=f.dataset.form;
  if(kind==='empleada'){const cuil=fd.cuil.replace(/\D/g,'');
    ls.set('empleada',{nombre:fd.nombre.trim(),cuil,categoria:fd.categoria,modalidad:fd.modalidad,forma:fd.forma,horasSem:Number(String(fd.horasSem).replace(',','.'))||0,sueldo:parseMoney(fd.sueldo),ingreso:fd.ingreso,zona:!!fd.zona,jubilada:!!fd.jubilada});
    ls.set('empleador',{nombre:fd.erNombre.trim(),cuit:fd.erCuit.replace(/\D/g,''),dom:fd.erDom.trim()});
    S.liqHoras=null;S.liqRemu=null;closeSheet();render();return toast('Datos guardados')}
  if(kind==='ajustes'){ls.set('avisos',{on:!!fd.on,hora:fd.hora||'09:00',vencDias:Number(fd.vencDias),fechaDias:Number(fd.fechaDias),eventoMin:Number(fd.eventoMin),resumen:!!fd.resumen,resumenHora:fd.resumenHora||'08:00',sueldo:!!fd.sueldo});closeSheet();render();scheduleNow(true);return toast('Ajustes guardados')}
  if(kind==='escala'){saveEscalaFromSheet();closeSheet();render();return toast('Valores actualizados')}
  if(kind==='liq'){const emp=ls.get('empleada',null);if(!emp)return;fd.sac=!!fd.sac;fd.aporte=!!fd.aporte;
    if(emp.forma==='mes'&&!(parseMoney(fd.remu)>0))return toast('Poné la remuneración del mes');
    if(emp.forma!=='mes'&&!(Number(String(fd.horasMes).replace(',','.'))>0))return toast('Poné las horas trabajadas en el mes');
    const recs=ls.get('recibos',[]);const prev=recs.find(r=>r.periodo===fd.periodo);
    const c=calcSueldo(emp,fd,prev&&prev.id);const r=Object.assign(c,{id:prev?prev.id:uid(),periodo:fd.periodo,fechaPago:fd.fechaPago,sac:fd.sac?c.sac:0,emp,empleador:ls.get('empleador',{})||{},creado:Date.now()});
    ls.set('recibos',recs.filter(x=>x.periodo!==fd.periodo).concat([r]));render();sheetRecibo(r.id);return toast(prev?'Recibo actualizado':'Recibo guardado')}
  let k,data,msg;
  if(kind==='ticket'){const monto=parseMoney(fd.monto);const cuit=fd.cuit.replace(/\D/g,'');
    if(cuit.length!==11)return toast('El CUIT tiene que tener 11 números');if(monto==null)return toast('Revisá el monto');
    k='tickets';data={cuit,razon:fd.razon.trim(),tipo:fd.tipo,pv:fd.pv.replace(/\D/g,'').padStart(4,'0'),nro:fd.nro.replace(/\D/g,'').padStart(8,'0'),fecha:fd.fecha,monto,rubro:fd.rubro};
    if(!fd.pv)data.pv='';if(!fd.nro)data.nro='';ls.set('rubro',fd.rubro);if(!id){data.cargado=false;S.tkMonth=fd.fecha.slice(0,7)}msg='Ticket guardado'}
  if(kind==='evento'){k='eventos';data={titulo:fd.titulo.trim(),fecha:fd.fecha,hora:fd.hora||'',repite:fd.repite||'NO',aviso:Number(fd.aviso),nota:fd.nota.trim()};msg='Recordatorio guardado'}
  if(kind==='venc'){k='venc';data={titulo:fd.titulo.trim(),fecha:fd.fecha,monto:parseMoney(fd.monto),repite:fd.repite};if(!id)data.pagado=false;msg='Vencimiento guardado'}
  if(kind==='qtarea'){const ti=(fd.titulo||'').trim();if(!ti)return;const ok=await safe(()=>store.add('tareas',{titulo:ti,fecha:'',hora:'',prioridad:'normal',nota:'',hecha:false}),'Tarea anotada');if(ok){if(sheetOpen)closeSheet();const el=document.getElementById('qt-in');if(el){el.value='';el.focus()}}return}
  if(kind==='tarea'){k='tareas';data={titulo:fd.titulo.trim(),fecha:fd.fecha||'',hora:fd.fecha?(fd.hora||''):'',prioridad:fd.prioridad||'normal',nota:(fd.nota||'').trim()};if(!id)data.hecha=false;msg='Tarea guardada'}
  if(kind==='fecha'){k='fechas';const d=parseISO(fd.fecha);data={titulo:fd.titulo.trim(),dia:d.getDate(),mes:d.getMonth()+1,anio:fd.conAnio?d.getFullYear():null};msg='Fecha guardada'}
  const ok=await safe(()=>id?store.update(k,id,data):store.add(k,data),msg);
  if(ok){closeSheet();if(kind==='ticket'&&S.view!=='tickets')go('tickets')}
});
